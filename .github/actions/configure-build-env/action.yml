name: 'Configure Build Environment'
inputs:
  node-version:
    description: 'Node.js Version'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: '${{ inputs.node-version }}'
        cache: 'yarn'

    - name: Install Dependencies
      shell: bash
      run: yarn install